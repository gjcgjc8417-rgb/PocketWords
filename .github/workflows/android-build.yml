name: Build PocketWords APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PocketWords-Android-Source-2.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Unpack Android project
        run: unzip -q PocketWords-Android-Source-2.zip -d source
      - name: Align Java and Kotlin versions
        working-directory: source/Source2/PocketWords
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          addition = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", "android {" + addition, 1)
              p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: source/Source2/PocketWords
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketWords-debug-apk
          path: source/Source2/PocketWords/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
