name: Build PocketWords APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PocketWords-Android-Source-2.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Unpack Android project
        run: unzip -q PocketWords-Android-Source-2.zip -d source

      - name: Build debug APK
        working-directory: source/PocketWords
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketWords-debug-apk
          path: source/PocketWords/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
